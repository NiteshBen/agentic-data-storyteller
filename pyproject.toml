[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-data-storyteller"
version = "1.0.0"
authors = [
  { name="Nitesh Beniwal", email="niteshben01@gmail.com" },
]
description = "Autonomous Multi-Agent Business Intelligence & Data Storytelling Engine"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "plotly>=5.15.0",
    "google-genai>=0.1.0",
]

[project.scripts]
agentic-storyteller = "agentic_data_storyteller.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
